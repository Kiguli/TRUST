name: Deploy Flask project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment
        run: bash scripts/check-deploy.sh

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Configure SSH

        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/github
          chmod 600 ~/.ssh/github
          cat >> ~/.ssh/config <<EOF
          Host target 
            Hostname $SSH_HOST
            User $SSH_USER
            Port 2202
            IdentityFile ~/.ssh/github
            LogLevel ERROR
            StrictHostKeyChecking no
          EOF

      - name: Deploy isolated release
        run: |
          ssh target bash -se -- "$GITHUB_SHA" << 'EOF'
            set -euo pipefail
            expected_sha="$1"
            [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
            cd /srv/trust.tgo.dev/current
            test "$(git remote get-url origin)" = "https://github.com/Kiguli/TRUST.git"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$expected_sha"
            git show "$expected_sha:scripts/deploy.sh" | bash -se -- "$expected_sha"
          EOF
